---
name: Molecule

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  molecule:
    name: molecule (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [default]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Molecule
        run: pip install ansible-core molecule "molecule-plugins[docker]"

      - name: Install the docker driver's collection
        run: ansible-galaxy collection install community.docker

      # Molecule's prerun installs this collection and
      # its own dependencies into .ansible/collections itself.
      - name: Run Molecule
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
